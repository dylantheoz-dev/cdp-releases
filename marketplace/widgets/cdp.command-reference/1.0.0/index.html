<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Command Reference</title><style>
:root{--accent:#8b5cf6;--accent-strong:#7c3aed;--accent-text:#c4b5fd;--accent-soft:rgba(139,92,246,.16);--surface:#111827;--surface-hover:#263348;--text-primary:#f8fafc;--text-secondary:#94a3b8;--border:#334155;--danger-text:#fca5a5;font-family:Segoe UI,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-width:0;background:transparent;color:var(--text-primary)}body{font-size:13px}main{display:grid;gap:11px}.top,.row,.heading,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.top{padding-bottom:10px;border-bottom:1px solid var(--border)}.eyebrow{font-size:10px;color:var(--accent-text);font-weight:850;letter-spacing:.1em;text-transform:uppercase}h2{margin:3px 0;font-size:19px}h3{margin:0;font-size:13px}.sub,.muted{font-size:11px;color:var(--text-secondary);line-height:1.5}.badge{font-size:10px;color:var(--accent-text);border:1px solid var(--border);border-radius:99px;background:var(--accent-soft);padding:5px 8px}
.panel,.stat{padding:11px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}.statRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat strong{display:block;font-size:19px}.stat span{font-size:10px;color:var(--text-secondary)}
button,input,select,textarea{font:inherit;min-width:0;border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text-primary);background:var(--surface-hover)}button{cursor:pointer}button:hover:not(:disabled){border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.5;cursor:default}.primary{color:white;font-weight:850;border-color:var(--accent);background:linear-gradient(130deg,var(--accent-strong),var(--accent))}.soft{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}.danger{color:var(--danger-text)}
.field{display:grid;gap:4px}.field span{font-size:10px;font-weight:750;color:var(--text-secondary)}.field input,.field select,.field textarea{width:100%}.field textarea{resize:vertical;min-height:55px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filter{display:grid;grid-template-columns:1.5fr 1fr;gap:8px;margin-top:9px}
.items{display:grid;gap:7px}.item{padding:10px;border-radius:10px;background:var(--surface-hover);border:1px solid var(--border);display:grid;gap:7px}.item:hover{border-color:var(--accent)}.command{font-size:15px;font-weight:900;color:var(--accent-text);overflow-wrap:anywhere}.meta,.actions{display:flex;flex-wrap:wrap;gap:7px}.meta{font-size:10px;color:var(--text-secondary)}.pill{padding:4px 7px;border:1px solid var(--border);border-radius:7px}.description{font-size:11px;color:var(--text-secondary);white-space:pre-wrap;overflow-wrap:anywhere}.actions{justify-content:flex-start}.actions button{padding:6px 9px;font-size:11px}.empty{text-align:center;padding:20px;color:var(--text-secondary)}.footer{padding-top:9px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;align-items:center}
@media(max-width:480px){.grid,.filter{grid-template-columns:1fr}.top{flex-wrap:wrap}.stat strong{font-size:16px}}
</style></head><body><main>
<header class="top"><div><div class="eyebrow">Creator knowledge base</div><h2>Chat Command Reference</h2><p class="sub">Find commands without switching bot dashboards</p></div><span id="badge" class="badge">0 commands</span></header>
<section class="statRow"><div class="stat"><strong id="total">0</strong><span>Saved commands</span></div><div class="stat"><strong id="tools">0</strong><span>Bot services</span></div><div class="stat"><strong id="favourites">0</strong><span>Favorites</span></div></section>
<section class="panel"><div class="heading"><h3 id="formTitle">Add command</h3><button id="cancel" type="button" hidden>Cancel edit</button></div><form id="form" style="display:grid;gap:8px;margin-top:9px"><div class="grid"><label class="field"><span>Chat command</span><input id="command" placeholder="!lurk" maxlength="65" required></label><label class="field"><span>Bot / service</span><select id="service"><option>Firebot</option><option>Mix It Up</option><option>Streamer.bot</option><option>Wizebot</option><option>Nightbot</option><option>Other</option></select></label><label class="field"><span>Who can use it?</span><input id="permission" placeholder="Everyone" maxlength="65"></label><label class="field"><span>Cooldown / requirements</span><input id="cooldown" placeholder="30s / subscriber only" maxlength="65"></label></div><label class="field"><span>What does it do?</span><textarea id="description" maxlength="700" placeholder="Describe the response, trigger or action."></textarea></label><button type="submit" class="primary" id="submit">＋ Save command</button></form></section>
<section class="panel"><div class="heading"><h3>Command directory</h3><span class="muted">Search and star favorites</span></div><div class="filter"><input id="search" type="search" placeholder="Search commands or descriptions" aria-label="Search commands"><select id="filter" aria-label="Filter bot"><option value="all">All services</option><option>Firebot</option><option>Mix It Up</option><option>Streamer.bot</option><option>Wizebot</option><option>Nightbot</option><option>Other</option><option value="favorites">Favorites only</option></select></div><div id="list" class="items" style="margin-top:9px"></div></section>
<footer class="footer"><span class="muted">Reference only: no bot commands are executed.</span><span class="muted">Saved in CDP</span></footer>
</main><script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const services=["Firebot","Mix It Up","Streamer.bot","Wizebot","Nightbot","Other"];
let commands=[],hydrated=false,editId=null,confirmDelete=null;
const norm=x=>({id:typeof x?.id==="string"?x.id.slice(0,90):uid(),command:typeof x?.command==="string"?x.command.trim().slice(0,65):"!command",service:services.includes(x?.service)?x.service:"Other",permission:typeof x?.permission==="string"?x.permission.slice(0,65):"",cooldown:typeof x?.cooldown==="string"?x.cooldown.slice(0,65):"",description:typeof x?.description==="string"?x.description.slice(0,700):"",favorite:x?.favorite===true});
const save=()=>parent.postMessage({type:"cdp:storage:set",value:{commands}},"*");
function render(){
 $("badge").textContent=commands.length+" commands";$("total").textContent=commands.length;$("tools").textContent=new Set(commands.map(c=>c.service)).size;$("favourites").textContent=commands.filter(c=>c.favorite).length;
 const q=$("search").value.toLowerCase().trim(),f=$("filter").value;
 const list=commands.filter(c=>(f==="all"||f==="favorites"&&c.favorite||f===c.service)&&(!q||[c.command,c.service,c.description,c.permission,c.cooldown].join(" ").toLowerCase().includes(q)));
 $("list").innerHTML=list.length?list.map(c=>'<article class="item"><div class="row"><div><div class="command">'+esc(c.command)+'</div><div class="meta"><span class="pill">'+esc(c.service)+'</span><span>'+esc(c.permission||"Everyone")+'</span><span>'+esc(c.cooldown||"No cooldown specified")+'</span></div></div><button class="'+(c.favorite?"soft":"")+'" data-act="star" data-id="'+esc(c.id)+'">'+(c.favorite?"★ Saved":"☆ Favorite")+'</button></div>'+(c.description?'<div class="description">'+esc(c.description)+'</div>':"")+'<div class="actions"><button data-act="edit" data-id="'+esc(c.id)+'">Edit</button><button class="danger" data-act="remove" data-id="'+esc(c.id)+'">'+(confirmDelete===c.id?"Confirm delete":"Delete")+'</button></div></article>').join(""):'<div class="empty">No matching commands. Add your first reference above.</div>';
}
function cancel(){editId=null;$("form").reset();$("formTitle").textContent="Add command";$("submit").textContent="＋ Save command";$("cancel").hidden=true}
$("cancel").onclick=cancel;
$("form").addEventListener("submit",e=>{e.preventDefault();if(!hydrated)return;const text=$("command").value.trim();if(!text)return;
 const data={command:text.slice(0,65),service:$("service").value,permission:$("permission").value.slice(0,65),cooldown:$("cooldown").value.slice(0,65),description:$("description").value.slice(0,700)};
 if(editId){const c=commands.find(c=>c.id===editId);if(c)Object.assign(c,data)}else if(commands.length<300)commands.push({...data,id:uid(),favorite:false});cancel();save();render()
});
$("list").addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(!b||!hydrated)return;const c=commands.find(c=>c.id===b.dataset.id);if(!c)return;
 if(b.dataset.act==="star"){c.favorite=!c.favorite;save();render()}
 if(b.dataset.act==="edit"){editId=c.id;for(const id of ["command","service","permission","cooldown","description"])$(id).value=c[id];$("formTitle").textContent="Edit command";$("submit").textContent="Save changes";$("cancel").hidden=false}
 if(b.dataset.act==="remove"){if(confirmDelete!==c.id){confirmDelete=c.id;render();return}commands=commands.filter(x=>x.id!==c.id);confirmDelete=null;if(editId===c.id)cancel();save();render()}
});
$("search").addEventListener("input",render);$("filter").addEventListener("change",render);
addEventListener("message",e=>{if(e.source!==parent||!e.data||typeof e.data!=="object")return;const m=e.data;
 if(m.type==="cdp:init"){for(const[k,v]of Object.entries(m.theme||{}))if(typeof v==="string"&&v.trim())document.documentElement.style.setProperty("--"+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase()),v);parent.postMessage({type:"cdp:storage:get",requestId:"commands-load"},"*")}
 else if(m.type==="cdp:storage:value"&&m.requestId==="commands-load"&&!hydrated){hydrated=true;if(Array.isArray(m.value?.commands))commands=m.value.commands.slice(0,300).map(norm);render()}
});render()
})();
</script></body></html>
