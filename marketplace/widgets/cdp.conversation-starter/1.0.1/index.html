<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversation Starter</title><style>:root{--accent:#8b5cf6;--surface:#111827;--surface-hover:#263348;--text-primary:#f8fafc;--text-secondary:#94a3b8;--border:#334155;--danger-text:#fca5a5;font-family:Segoe UI,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text-primary);font-size:13px}main{display:grid;gap:10px}h2,h3,p{margin:0}h2{font-size:19px}h3{font-size:13px}header{border-bottom:1px solid var(--border);padding-bottom:9px}.panel{display:grid;gap:9px;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface);min-width:0}.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.row>*{min-width:0}.grow{flex:1}.muted,small{color:var(--text-secondary);font-size:11px}button,input,select,textarea{font:inherit;color:var(--text-primary);background:var(--surface-hover);border:1px solid var(--border);border-radius:7px;padding:8px;min-width:0}button{cursor:pointer}button:disabled,fieldset:disabled{opacity:.6;cursor:default}button:hover:not(:disabled){border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:#fff;font-weight:700}.danger{color:var(--danger-text)}label{display:grid;gap:4px;color:var(--text-secondary);font-size:11px}label input,label textarea,label select{width:100%}textarea{resize:vertical;min-height:60px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}.item{display:grid;gap:6px;border-top:1px solid var(--border);padding-top:8px;overflow-wrap:anywhere}.prompt{font-size:22px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}.list{display:grid;gap:8px;max-height:320px;overflow:auto}.status{color:var(--danger-text);font-size:12px} [hidden]{display:none!important}@media(max-width:380px){.grid{grid-template-columns:1fr}.prompt{font-size:18px}}
form{display:grid;gap:8px}form.row{display:flex}</style></head><body><main><header><h2>Conversation Starter</h2><p class="muted">A fresh topic whenever you need one.</p></header><p id="status" role="status" class="status" hidden></p><fieldset id="controls" disabled><section class="panel"><div class="row"><label class="grow">Category<select id="category"><option>All</option><option>Gaming</option><option>Game-specific</option><option>Just Chatting</option><option>Icebreakers</option><option>Community</option><option>Custom</option><option>Favorites</option></select></label><label>Rotate<select id="interval"><option value="0">Manual</option><option value="60">1 minute</option><option value="180">3 minutes</option><option value="300">5 minutes</option><option value="600">10 minutes</option></select></label></div><div id="gamePanel" class="panel" hidden><label>Find a game<input id="gameSearch" maxlength="100" placeholder="Search game titles or aliases" autocomplete="off"></label><label>Game collection<select id="game"></select></label><small id="gameHelp"></small><button id="general" type="button">Use general gaming prompts instead</button></div><label>Search questions<input id="questionSearch" maxlength="120" placeholder="e.g. favorite weapon, boss, soundtrack" autocomplete="off"></label><div id="results" class="list" hidden></div><p id="prompt" class="prompt" aria-live="polite">Loading prompts...</p><p id="meta" class="muted"></p><div class="row"><button id="next" class="primary" type="button">Next prompt</button><button id="favorite" type="button">Favorite</button></div></section><section class="panel"><h3>Custom prompts</h3><form id="add"><label>Game (optional)<input id="customGame" maxlength="100" placeholder="Leave blank for a general custom prompt"></label><label>Question<input id="custom" maxlength="250" required placeholder="Add your own question"></label><button type="submit">Add prompt</button></form><div id="customList" class="list"></div></section><section class="panel"><div class="row"><h3 class="grow">Recent prompts</h3><button id="clear" type="button">Clear history</button></div><div id="history" class="list"></div></section></fieldset></main><script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),post=(type,extra={})=>parent.postMessage({type,...extra},"*");
const txt=(x,n)=>typeof x==="string"?x.slice(0,n):"",arr=x=>Array.isArray(x)?x:[],uid=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
function el(tag,value,cls){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n}
function btn(value,action,cls){const n=el("button",value,cls);n.type="button";n.onclick=action;return n}
function theme(t){for(const [k,v] of Object.entries(t||{}))if(typeof v==="string"&&v.trim()){if(k==="colorScheme"&&["light","dark"].includes(v))document.documentElement.style.colorScheme=v;document.documentElement.style.setProperty("--"+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase()),v)}}
let hydrated=false,snapshot="";
function notice(s){$("status").textContent=s;$("status").hidden=!s}
function save(){if(!hydrated)return false;const serialized=JSON.stringify(state);if(new TextEncoder().encode(serialized).length>245760){state=JSON.parse(snapshot);notice("Storage limit reached. Remove older entries or shorten notes.");render();return false}post("cdp:storage:set",{value:state});snapshot=serialized;notice("");return true}
function changed(){const ok=save();render();return ok}
addEventListener("message",e=>{if(e.source!==parent||!e.data||typeof e.data!=="object")return;const m=e.data;if(m.type==="cdp:theme")theme(m.theme);if(m.type==="cdp:init"){theme(m.theme);if(!hydrated)post("cdp:storage:get",{requestId:"wave1-load"})}if(m.type==="cdp:storage:value"&&m.requestId==="wave1-load"&&!hydrated){state=normalize(m.value);snapshot=JSON.stringify(state);hydrated=true;$("controls").disabled=false;render()}});


const builtins=[["Gaming","What game would you love to experience again for the first time?"],["Gaming","Which game has your favorite soundtrack?"],["Gaming","What is your most memorable gaming fail?"],["Gaming","What game mechanic do you wish more games had?"],["Gaming","What upcoming game are you excited about?"],["Gaming","Which boss fight tested your patience the most?"],["Just Chatting","What is something good that happened this week?"],["Just Chatting","What hobby would you try if time were not an issue?"],["Just Chatting","What is your favorite comfort food?"],["Just Chatting","What is one small thing that makes your day better?"],["Just Chatting","What is the best movie you have watched recently?"],["Just Chatting","What skill would you like to learn?"],["Icebreakers","Would you rather explore space or the deep ocean?"],["Icebreakers","What fictional world would you visit for a day?"],["Icebreakers","What is an unusual talent you have?"],["Icebreakers","If you could teleport anywhere for dinner, where would you go?"],["Icebreakers","What song always puts you in a good mood?"],["Icebreakers","What is your ideal weekend?"],["Community","What would make a great community game night?"],["Community","What is your favorite moment from a stream?"],["Community","What challenge should we try together next?"],["Community","What is something you are proud of lately?"],["Community","What is a game you would recommend to chat?"],["Community","What kind of content would you like to see more often?"]].map(([category,text],i)=>({id:"b"+i,category,text}));
const gamePacks=[["fortnite","Fortnite",["fortnite battle royale","fortnite zero build"],["Do you prefer Build Mode or Zero Build, and why?","What is your favorite Fortnite season so far?","Which landing spot always gets you into trouble?","What weapon would you bring back from the vault?","What is your favorite skin or crossover?","What is your best clutch moment?"]],["minecraft","Minecraft",["minecraft java","minecraft bedrock"],["What is the first thing you build in a new world?","Do you prefer survival, creative, or hardcore?","Which biome would you choose for a permanent base?","What is your favorite building block?","Which mob gives you the most trouble?","What is the biggest project you have finished?"]],["pokemon","Pokemon",["pokemon","pokemon nuzlocke","pokemon heartgold","pokemon heartgold","pokemon scarlet and violet","pokemon battle revolution"],["Which starter would you pick if you could choose any generation?","What is your favorite Pokemon type?","Which gym or trainer battle gave you the most trouble?","What is the most underrated Pokemon?","Which Pokemon would you never put on a Nuzlocke team?","What is your favorite region to explore?"]],["gta","Grand Theft Auto V",["gta","gta v","gta 5","gta online","lspdfr","grand theft auto"],["What is your favorite thing to do in Los Santos?","Which vehicle would you keep if you could only own one?","What is the funniest unexpected thing that has happened to you in GTA?","Do you prefer missions, roleplay, or free roam?","Which area of the map deserves more attention?","What would you add to the next GTA game?"]],["zelda","The Legend of Zelda",["zelda","tears of the kingdom","breath of the wild","totk","botw"],["Which Zelda dungeon is your favorite?","What is the strangest solution you have used to solve a puzzle?","Which item or ability could you not live without?","Which location in Hyrule would you explore first?","What is your favorite Zelda soundtrack?","Do you prefer traditional dungeons or open-world exploration?"]],["cod","Call of Duty",["cod","warzone","black ops","modern warfare"],["Do you prefer multiplayer, Zombies, or Warzone?","What is your favorite map from any Call of Duty game?","Which loadout do you always come back to?","What is your most memorable clutch?","Which game mode deserves to return?","Do you prefer aggressive play or holding angles?"]],["valorant","VALORANT",["valorant"],["Which agent do you enjoy playing most?","What map do you wish you could queue every time?","Do you prefer attacking or defending?","What is your favorite weapon to buy on a full round?","Which agent pairing works best for your playstyle?","What is the best advice you have received about improving?"]],["overwatch","Overwatch 2",["overwatch","ow2"],["Which hero would you choose for a full match?","Do you prefer tank, damage, or support?","Which map feels best for your main hero?","What is your favorite ultimate combo?","What is the most satisfying save you have made?","Which hero would you like to learn next?"]],["stardew","Stardew Valley",["stardew","sdv"],["Which farm layout is your favorite?","Who is your favorite Pelican Town resident?","Do you focus on farming, fishing, or mining first?","What is your favorite in-game season?","What do you always spend your first big earnings on?","Which festival do you look forward to most?"]],["roblox","Roblox",["roblox"],["Which Roblox experience do you keep returning to?","Do you prefer building, roleplay, or competitive experiences?","What is your favorite experience to play with friends?","What type of Roblox game would you create?","What is the funniest moment you have had in an experience?","Which experience deserves more attention?"]],["apex","Apex Legends",["apex","apex legends"],["Which legend suits your playstyle best?","What weapon combination feels most reliable?","Do you like hot drops or slower starts?","Which teammate ability do you appreciate the most?","What is your favorite map?","What is the best comeback you have had in a match?"]],["rocket","Rocket League",["rocket league","rl"],["Do you prefer one-on-one, doubles, or standard matches?","What mechanic are you trying to improve?","Which car feels best to play?","What is your favorite custom training drill?","What was your most satisfying goal?","Would you rather score a difficult shot or make a last-second save?"]],["sims","The Sims 4",["sims","sims 4","the sims"],["Do you prefer building houses or telling stories?","Which expansion has changed how you play the most?","What is your favorite kind of build?","Which ridiculous thing has happened to your Sims?","What challenge would you try on a new save?","Do you plan your Sims' lives or let chaos decide?"]],["league","League of Legends",["league","lol"],["Which champion do you never get tired of playing?","Which role suits you best?","What is your favorite team composition to play with?","What is the most memorable comeback you have been part of?","Do you prefer ranked, normals, or ARAM?","Which champion would you like to learn next?"]],["deadbydaylight","Dead by Daylight",["dbd"],["Do you prefer playing survivor or killer?","Which map is your favorite?","What perk do you find yourself using most often?","Which killer do you enjoy facing?","What is your most memorable escape?","Which horror crossover would you like to see?"]]];
const key=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const specific=gamePacks.flatMap(([game,name,aliases,questions])=>questions.map((text,i)=>({id:"g-"+game+"-"+i,category:"Game-specific",game,gameName:name,text})));
const categories=["All","Gaming","Game-specific","Just Chatting","Icebreakers","Community","Custom","Favorites"],intervals=[0,60,180,300,600];
function gameInfo(label){const k=key(label);if(!k)return null;const match=gamePacks.find(([id,name,aliases])=>[id,name,...aliases].some(a=>key(a)===k));return match?{game:match[0],gameName:match[1]}:{game:"custom:"+k,gameName:label.trim().slice(0,100)}}
function normalize(v){const custom=arr(v?.custom).slice(0,100).map(x=>{const info=gameInfo(txt(x?.gameName,100));return{id:txt(x?.id,90)||uid(),category:"Custom",text:txt(x?.text,250).trim(),...(info||{})}}).filter(x=>x.text);const ids=new Set([...builtins,...specific,...custom].map(x=>x.id));const games=new Set([...gamePacks.map(x=>x[0]),...custom.map(x=>x.game).filter(Boolean)]);return{custom,category:categories.includes(v?.category)?v.category:"All",game:games.has(v?.game)?v.game:"",interval:intervals.includes(v?.interval)?v.interval:0,favorites:[...new Set(arr(v?.favorites).filter(x=>ids.has(x)))],history:arr(v?.history).filter(x=>ids.has(x)).slice(0,30),current:v?.current===null?null:ids.has(v?.current)?v.current:builtins[0].id,nextAt:Number.isFinite(v?.nextAt)?Math.max(0,Math.min(Date.now()+600000,v.nextAt)):0}}
let state=normalize(null),clearPending=false,deletePending="",gameSearch="",questionSearch="";
const all=()=>[...builtins,...specific,...state.custom],current=()=>all().find(x=>x.id===state.current);
function collections(){const result=gamePacks.map(([id,name,aliases])=>({id,name,aliases}));for(const p of state.custom)if(p.game&&!result.some(g=>g.id===p.game))result.push({id:p.game,name:p.gameName,aliases:[]});return result.sort((a,b)=>a.name.localeCompare(b.name))}
function pool(){const query=key(questionSearch);return all().filter(p=>{const inCategory=state.category==="All"?!p.game:state.category==="Game-specific"?!!state.game&&p.game===state.game:state.category==="Favorites"?state.favorites.includes(p.id):p.category===state.category;return inCategory&&(!query||key(p.text+" "+(p.gameName||"")).includes(query))})}
function pick(id){const p=pool().find(p=>p.id===id);if(!p)return;state.current=p.id;state.history=[p.id,...state.history.filter(x=>x!==p.id)].slice(0,30);state.nextAt=state.interval?Date.now()+state.interval*1000:0;changed()}
function next(){if(!hydrated)return;let options=pool().filter(x=>x.id!==state.current&&!state.history.includes(x.id));if(!options.length)options=pool().filter(x=>x.id!==state.current);if(!options.length)options=pool();if(!options.length){state.current=null;state.nextAt=0;changed();return}pick(options[Math.floor(Math.random()*options.length)].id)}
function reconcile(){if(!pool().some(p=>p.id===state.current)){next();return}if(state.interval&&!state.nextAt)state.nextAt=Date.now()+state.interval*1000;changed()}
function gamesUI(){const query=key(gameSearch),games=collections().filter(g=>!query||[g.name,...g.aliases].some(a=>key(a).includes(query)));const selected=collections().find(g=>g.id===state.game);const select=$("game");const placeholder=el("option","Select a game");placeholder.value="";select.replaceChildren(placeholder);if(selected&&!games.some(g=>g.id===selected.id))games.unshift(selected);for(const g of games){const o=el("option",g.name);o.value=g.id;select.append(o)}select.value=state.game;$("gameHelp").textContent=selected?selected.name+" | "+all().filter(p=>p.game===selected.id).length+" questions":games.length?games.length+" matching game collections":"No matching collection. Add your own game-specific prompt below.";$("gamePanel").hidden=state.category!=="Game-specific"}
function render(){if(!hydrated)return;$("category").value=state.category;$("interval").value=String(state.interval);gamesUI();const ps=pool(),c=ps.find(p=>p.id===state.current);$("prompt").textContent=c?.text||(state.category==="Game-specific"&&!state.game?"Select a game collection to get started.":"No matching questions. Try a different search or add a custom prompt.");$("meta").textContent=(c?(c.gameName||c.category)+" | ":"")+ps.length+" available";$("favorite").disabled=!c;$("favorite").textContent=c&&state.favorites.includes(c.id)?"Remove favorite":"Favorite";$("next").disabled=!ps.length;$("clear").textContent=clearPending?"Confirm clear":"Clear history";$("results").hidden=!questionSearch;$("results").replaceChildren();if(questionSearch)for(const p of ps.slice(0,50))$("results").append(btn(p.text,()=>pick(p.id)));$("customList").replaceChildren();for(const p of state.custom){const r=el("div",undefined,"item");r.append(el("span",p.text),el("small",p.gameName||"General custom"),btn(deletePending===p.id?"Confirm remove":"Remove",()=>{if(deletePending!==p.id){deletePending=p.id;render();return}state.custom=state.custom.filter(x=>x.id!==p.id);state.favorites=state.favorites.filter(id=>id!==p.id);state.history=state.history.filter(id=>id!==p.id);deletePending="";if(!collections().some(g=>g.id===state.game))state.game="";reconcile()},"danger"));$("customList").append(r)}if(!state.custom.length)$("customList").append(el("small","No custom prompts yet."));$("history").replaceChildren(...state.history.map(id=>el("div",all().find(x=>x.id===id)?.text||"","item")));if(!state.history.length)$("history").append(el("small","No recent prompts."))}
$("next").onclick=next;$("category").onchange=()=>{state.category=$("category").value;questionSearch="";$("questionSearch").value="";next()};$("gameSearch").oninput=()=>{gameSearch=$("gameSearch").value;gamesUI()};$("game").onchange=()=>{state.game=$("game").value;questionSearch="";$("questionSearch").value="";const selected=collections().find(g=>g.id===state.game);$("customGame").value=selected?.name||"";next()};$("general").onclick=()=>{state.category="Gaming";questionSearch="";$("questionSearch").value="";next()};$("questionSearch").oninput=()=>{questionSearch=$("questionSearch").value;reconcile()};$("interval").onchange=()=>{state.interval=Number($("interval").value);state.nextAt=state.interval&&pool().length?Date.now()+state.interval*1000:0;changed()};$("favorite").onclick=()=>{const c=current();if(!c||!pool().some(p=>p.id===c.id))return;state.favorites=state.favorites.includes(c.id)?state.favorites.filter(id=>id!==c.id):[...state.favorites,c.id];reconcile()};$("add").onsubmit=e=>{e.preventDefault();const text=$("custom").value.trim();if(!hydrated||!text)return;if(state.custom.length>=100){notice("Maximum 100 custom prompts.");return}const info=gameInfo($("customGame").value);const p={id:uid(),category:"Custom",text:txt(text,250),...(info||{})};state.custom.push(p);if(info){state.category="Game-specific";state.game=info.game;gameSearch="";$("gameSearch").value=""}else state.category="Custom";questionSearch="";$("questionSearch").value="";pick(p.id);$("custom").value=""};$("clear").onclick=()=>{if(!clearPending){clearPending=true;render();return}clearPending=false;state.history=[];changed()};addEventListener("message",e=>{if(e.source===parent&&e.data?.type==="cdp:storage:value"&&e.data.requestId==="wave1-load"&&hydrated){if(!pool().some(p=>p.id===state.current)&&pool().length)next();const selected=collections().find(g=>g.id===state.game);$("customGame").value=selected?.name||""}});setInterval(()=>{if(hydrated&&state.interval&&state.nextAt&&Date.now()>=state.nextAt)next()},1000);

})();
</script></body></html>
