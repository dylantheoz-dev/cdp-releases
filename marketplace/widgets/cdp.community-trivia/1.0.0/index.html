<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Trivia</title><style>:root{--accent:#8b5cf6;--surface:#111827;--surface-hover:#263348;--text-primary:#f8fafc;--text-secondary:#94a3b8;--border:#334155;--danger-text:#fca5a5;font-family:Segoe UI,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text-primary);font-size:13px}main{display:grid;gap:10px}h2,h3,p{margin:0}h2{font-size:19px}h3{font-size:13px}header{border-bottom:1px solid var(--border);padding-bottom:9px}.panel{display:grid;gap:9px;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface);min-width:0}.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.row>*{min-width:0}.grow{flex:1}.muted,small{color:var(--text-secondary);font-size:11px}button,input,select,textarea{font:inherit;color:var(--text-primary);background:var(--surface-hover);border:1px solid var(--border);border-radius:7px;padding:8px;min-width:0}button{cursor:pointer}button:disabled,fieldset:disabled{opacity:.6;cursor:default}button:hover:not(:disabled){border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:#fff;font-weight:700}.danger{color:var(--danger-text)}label{display:grid;gap:4px;color:var(--text-secondary);font-size:11px}label input,label textarea,label select{width:100%}textarea{resize:vertical;min-height:60px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}.item{display:grid;gap:6px;border-top:1px solid var(--border);padding-top:8px;overflow-wrap:anywhere}.prompt{font-size:22px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}.list{display:grid;gap:8px;max-height:320px;overflow:auto}.status{color:var(--danger-text);font-size:12px} [hidden]{display:none!important}@media(max-width:380px){.grid{grid-template-columns:1fr}.prompt{font-size:18px}}
form{display:grid;gap:8px}form.row{display:flex}
label.row{display:flex}label.row input{width:auto}.list{max-height:450px}</style></head><body><main><header><h2>Community Trivia</h2><p class="muted">Host a quiz and score players manually.</p></header><p id="status" role="status" class="status" hidden></p><fieldset id="controls" disabled><section class="panel"><div class="grid"><label>Question pack<select id="pack"><option>General</option><option>Gaming</option><option>Custom</option></select></label><label>Answer time<select id="duration"><option value="15">15 seconds</option><option value="30">30 seconds</option><option value="60">60 seconds</option></select></label></div><p id="question" class="prompt"></p><p id="choices"></p><p id="clock" class="muted"></p><p id="answer" hidden></p><div class="row"><button id="next" type="button" class="primary">Next question</button><button id="start" type="button">Start timer</button><button id="reveal" type="button">Reveal answer</button></div><label class="row"><input id="broadcast" type="checkbox"> Show question in Browser Source</label></section><section class="panel"><div class="row"><h3 class="grow">Scores</h3><button id="reset" type="button" class="danger">Reset scores</button></div><form id="playerForm" class="row"><input id="player" aria-label="Player name" maxlength="60" required class="grow" placeholder="Player name"><button type="submit">Add player</button></form><div id="scores" class="list"></div></section><section class="panel"><h3>Custom question pack</h3><form id="questionForm"><label>Question<input id="q" required maxlength="120"></label><label>Choices (optional, up to 4, one per line)<textarea id="opts" maxlength="320"></textarea></label><label>Correct answer<input id="a" required maxlength="80"></label><button type="submit">Add question</button></form><div id="custom" class="list"></div></section></fieldset></main><script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),post=(type,extra={})=>parent.postMessage({type,...extra},"*");
const txt=(x,n)=>typeof x==="string"?x.slice(0,n):"",arr=x=>Array.isArray(x)?x:[],uid=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
function el(tag,value,cls){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n}
function btn(value,action,cls){const n=el("button",value,cls);n.type="button";n.onclick=action;return n}
function theme(t){for(const [k,v] of Object.entries(t||{}))if(typeof v==="string"&&v.trim()){if(k==="colorScheme"&&["light","dark"].includes(v))document.documentElement.style.colorScheme=v;document.documentElement.style.setProperty("--"+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase()),v)}}
let hydrated=false,snapshot="";
function notice(s){$("status").textContent=s;$("status").hidden=!s}
function save(){if(!hydrated)return false;const serialized=JSON.stringify(state);if(new TextEncoder().encode(serialized).length>245760){state=JSON.parse(snapshot);notice("Storage limit reached. Remove older entries or shorten notes.");render();return false}post("cdp:storage:set",{value:state});snapshot=serialized;notice("");return true}
function changed(){const ok=save();render();return ok}
addEventListener("message",e=>{if(e.source!==parent||!e.data||typeof e.data!=="object")return;const m=e.data;if(m.type==="cdp:theme")theme(m.theme);if(m.type==="cdp:init"){theme(m.theme);if(!hydrated)post("cdp:storage:get",{requestId:"wave1-load"})}if(m.type==="cdp:storage:value"&&m.requestId==="wave1-load"&&!hydrated){state=normalize(m.value);snapshot=JSON.stringify(state);hydrated=true;$("controls").disabled=false;render()}});


const builtin=[["General","What is the largest planet in our solar system?","Jupiter",["Earth","Jupiter","Saturn","Neptune"]],["General","How many sides does a hexagon have?","6",["5","6","7","8"]],["General","What is the chemical symbol for gold?","Au",["Ag","Au","Fe","Go"]],["General","What is the capital of Canada?","Ottawa",["Toronto","Vancouver","Ottawa","Montreal"]],["General","Which instrument typically has 88 keys?","Piano",[]],["General","What is the fastest land animal?","Cheetah",[]],["Gaming","What color is the most common type of rupee in The Legend of Zelda?","Green",["Red","Blue","Green","Purple"]],["Gaming","What is the name of Mario's brother?","Luigi",[]],["Gaming","Which Pokemon is number 025 in the National Pokedex?","Pikachu",["Eevee","Pikachu","Charmander","Mew"]],["Gaming","Which game features Creepers and Endermen?","Minecraft",[]],["Gaming","What is the currency in Animal Crossing?","Bells",["Coins","Bells","Rupees","Gems"]],["Gaming","Which company developed the original Tetris creator's game?","Alexey Pajitnov created it independently at a Soviet computing center",[]]].slice(0,11).map(([pack,q,a,opts],i)=>({id:"b"+i,pack,q,a,opts}));const packs=["General","Gaming","Custom"],durations=[15,30,60];let state=normalize(null),resetPending=false,deletePending="",playerDelete="";
function normalize(v){const custom=arr(v?.custom).slice(0,150).map(x=>({id:txt(x?.id,90)||uid(),pack:"Custom",q:txt(x?.q,120),a:txt(x?.a,80),opts:arr(x?.opts).slice(0,4).map(y=>txt(y,80)).filter(Boolean)})).filter(x=>x.q&&x.a);const ids=new Set([...builtin,...custom].map(x=>x.id));const players=arr(v?.players).slice(0,100).map(p=>({id:txt(p?.id,90)||uid(),name:txt(p?.name,60),score:Number.isInteger(p?.score)?Math.min(999999,Math.max(0,p.score)):0})).filter(p=>p.name);return{custom,players,pack:packs.includes(v?.pack)?v.pack:"General",duration:durations.includes(v?.duration)?v.duration:30,current:ids.has(v?.current)?v.current:builtin[0].id,used:arr(v?.used).filter(x=>ids.has(x)).slice(0,200),revealed:v?.revealed===true,endAt:Number.isFinite(v?.endAt)?Math.min(Date.now()+60000,Math.max(0,v.endAt)):0,broadcast:v?.broadcast===true}}
const all=()=>[...builtin,...state.custom],question=()=>all().find(x=>x.id===state.current),pool=()=>all().filter(x=>x.pack===state.pack);
function next(){let options=pool().filter(x=>!state.used.includes(x.id)&&x.id!==state.current);if(!options.length)options=pool().filter(x=>x.id!==state.current);if(!options.length)options=pool();const q=options[Math.floor(Math.random()*options.length)];state.current=q?.id||null;state.used=q?[q.id,...state.used.filter(x=>x!==q.id)].slice(0,200):[];state.revealed=false;state.endAt=0;changed()}
const seconds=()=>Math.max(0,Math.ceil((state.endAt-Date.now())/1000));function clock(){if(!hydrated)return;$("clock").textContent=state.endAt?(seconds()?seconds()+" seconds remaining":"Time is up"):"Timer ready"}
function publish(){if(!hydrated)return;const q=question(),rows=[];if(state.broadcast&&q){rows.push({label:"Question",value:q.q.slice(0,80)});q.opts.forEach((x,i)=>rows.push({label:String.fromCharCode(65+i),value:x}));if(state.endAt)rows.push({label:"Time remaining",value:seconds()+"s"});if(state.revealed)rows.push({label:"Answer",value:q.a})}post("cdp:browser-source",{value:{version:1,kind:"counters",title:state.broadcast?"Community Trivia":"Trivia display hidden",rows}})}
function render(){if(!hydrated)return;const q=question();$("pack").value=state.pack;$("duration").value=String(state.duration);$("question").textContent=q?.q||"No questions in this pack."; $("choices").textContent=q?.opts.map((x,i)=>String.fromCharCode(65+i)+". "+x).join(" | ")||"";$("answer").textContent=q?"Answer: "+q.a:"";$("answer").hidden=!q||!state.revealed;$("reveal").disabled=!q||state.revealed;$("start").disabled=!q||state.revealed;$("next").disabled=!pool().length;$("broadcast").checked=state.broadcast;$("reset").textContent=resetPending?"Confirm reset":"Reset scores";$("scores").replaceChildren();for(const p of [...state.players].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name))){const row=el("div",undefined,"row item");row.append(el("strong",p.name+" | "+p.score,"grow"),btn("+1",()=>{p.score=Math.min(999999,p.score+1);changed()}),btn("-1",()=>{p.score=Math.max(0,p.score-1);changed()}),btn(playerDelete===p.id?"Confirm":"Remove",()=>{if(playerDelete!==p.id){playerDelete=p.id;render();return}state.players=state.players.filter(x=>x.id!==p.id);playerDelete="";changed()},"danger"));$("scores").append(row)}$("custom").replaceChildren();for(const item of state.custom){const row=el("div",undefined,"item");row.append(el("span",item.q),btn(deletePending===item.id?"Confirm remove":"Remove",()=>{if(deletePending!==item.id){deletePending=item.id;render();return}state.custom=state.custom.filter(x=>x.id!==item.id);state.used=state.used.filter(x=>x!==item.id);deletePending="";if(state.current===item.id)next();else changed()},"danger"));$("custom").append(row)}clock();publish()}
$("next").onclick=next;$("pack").onchange=()=>{state.pack=$("pack").value;next()};$("duration").onchange=()=>{state.duration=Number($("duration").value);changed()};$("start").onclick=()=>{state.endAt=Date.now()+state.duration*1000;changed()};$("reveal").onclick=()=>{state.revealed=true;state.endAt=0;changed()};$("broadcast").onchange=()=>{state.broadcast=$("broadcast").checked;changed()};$("playerForm").onsubmit=e=>{e.preventDefault();const name=$("player").value.trim();if(!name)return;if(state.players.length>=100||state.players.some(x=>x.name.toLowerCase()===name.toLowerCase())){notice("Use a unique player name; maximum 100 players.");return}state.players.push({id:uid(),name,score:0});if(changed())$("playerForm").reset()};$("reset").onclick=()=>{if(!resetPending){resetPending=true;render();return}resetPending=false;state.players.forEach(p=>p.score=0);changed()};$("questionForm").onsubmit=e=>{e.preventDefault();const q=$("q").value.trim(),a=$("a").value.trim(),opts=$("opts").value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);if(!q||!a)return;if(state.custom.length>=150||opts.length>4||opts.some(s=>s.length>80)||opts.length&&!opts.some(x=>x.toLowerCase()===a.toLowerCase())){notice("Use up to four choices of 80 characters, including the correct answer; maximum 150 questions.");return}state.custom.push({id:uid(),pack:"Custom",q,a,opts});if(changed())$("questionForm").reset()};setInterval(()=>{clock();publish()},1000);
})();
</script></body></html>
