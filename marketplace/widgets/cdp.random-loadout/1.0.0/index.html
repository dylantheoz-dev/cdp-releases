<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Loadout</title><style>*{box-sizing:border-box}body{margin:0;font:13px system-ui;color:var(--text-primary,#eee);background:var(--surface,#181824)}main{padding:16px;display:grid;gap:12px}h2,p{margin:0}p,small{color:var(--text-secondary,#b9b9cc);line-height:1.5}section,form{display:grid;gap:10px;padding:12px;border:1px solid var(--border,#39394b);border-radius:12px;background:var(--surface-hover,#222232)}label{display:grid;gap:5px}input,textarea,select,button{font:inherit;color:inherit;background:var(--surface,#181824);border:1px solid var(--border,#39394b);border-radius:8px;padding:9px;width:100%}button{cursor:pointer}button:hover{border-color:var(--accent,#8b5cf6)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent,#8b5cf6)}.primary{background:var(--accent,#7545ce);color:white}#notice{min-height:20px}#rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:12px;overflow-wrap:anywhere}.row strong{max-width:65%}textarea{min-height:100px;resize:vertical}[hidden]{display:none!important}</style></head><body><main><h2>Random Loadout</h2><p>Roll a weapon, rule and bonus challenge. Configure Twitch triggers above to let viewers roll.</p><p id="notice" role="status">Loading saved setup…</p><section><div id="rows"></div><button id="roll" class="primary" disabled>Roll loadout</button></section><form id="settings"><label>Weapons, one per line<textarea id="weapons" maxlength="6000"></textarea></label><label>Restrictions, one per line<textarea id="rules" maxlength="6000"></textarea></label><label>Bonus challenges, one per line<textarea id="bonuses" maxlength="6000"></textarea></label><button id="save" disabled>Save options</button></form></main><script>(()=>{"use strict";const $=id=>document.getElementById(id);function theme(t){for(const [k,v]of Object.entries(t||{}))if(typeof v==="string")document.documentElement.style.setProperty("--"+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase()),v)}function row(a,b){const el=document.createElement("div");el.className="row";const title=document.createElement("strong"),value=document.createElement("span");title.textContent=a;value.textContent=b;el.append(title,value);$("rows").append(el)}let hydrated=false;let state={weapons:["Shotgun","Assault rifle","Pistol"],rules:["No healing during combat","No vehicles","One weapon slot"],bonuses:["Land somewhere new","Protect a teammate","Take the long route"],result:[]};function list(v){return Array.isArray(v)?v.filter(x=>typeof x==="string"&&x.trim()).slice(0,100).map(x=>x.slice(0,60)):[]}function save(){parent.postMessage({type:"cdp:storage:set",value:state},"*")}function render(){for(const k of ["weapons","rules","bonuses"])$(k).value=state[k].join("\n");$("rows").replaceChildren();state.result.forEach((v,i)=>row(["Weapon","Restriction","Bonus"][i],v));display()}function display(){if(hydrated)parent.postMessage({type:"cdp:browser-source",value:{version:1,kind:"counters",title:"Random Loadout",rows:state.result.map((v,i)=>({label:["Weapon","Restriction","Bonus"][i],value:v}))}},"*")}function choose(items){const a=new Uint32Array(1),limit=4294967296-4294967296%items.length;do{crypto.getRandomValues(a)}while(a[0]>=limit);return items[a[0]%items.length]}function roll(){if(!hydrated)return;state.result=[state.weapons,state.rules,state.bonuses].map(choose);save();render();$("notice").textContent="Loadout rolled."}$("roll").onclick=roll;$("settings").onsubmit=e=>{e.preventDefault();if(!hydrated)return;const next={...state};for(const k of ["weapons","rules","bonuses"]){next[k]=list($(k).value.split("\n"));if(!next[k].length){$("notice").textContent="Add at least one option to each group.";return}}state=next;save();render();$("notice").textContent="Options saved."};addEventListener("message",e=>{if(e.source!==parent)return;const m=e.data;if(m?.type==="cdp:init"){theme(m.theme);if(!hydrated)parent.postMessage({type:"cdp:storage:get",requestId:"loadout-load"},"*")}if(m?.type==="cdp:theme")theme(m.theme);if(m?.type==="cdp:storage:value"&&m.requestId==="loadout-load"&&!hydrated){for(const k of ["weapons","rules","bonuses"]){const items=list(m.value?.[k]);if(items.length)state[k]=items}state.result=list(m.value?.result).slice(0,3);hydrated=true;$("roll").disabled=false;$("save").disabled=false;$("notice").textContent="Ready to roll.";render()}if(m?.type==="cdp:trigger")roll()});setInterval(display,1000);render();})();</script></body></html>
