<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twitch Predictions</title><style>*{box-sizing:border-box}body{margin:0;font:13px system-ui;color:var(--text-primary,#eee);background:var(--surface,#181824)}main{padding:16px;display:grid;gap:12px}h2,p{margin:0}p,small{color:var(--text-secondary,#b9b9cc);line-height:1.5}section,form{display:grid;gap:10px;padding:12px;border:1px solid var(--border,#39394b);border-radius:12px;background:var(--surface-hover,#222232)}label{display:grid;gap:5px}input,textarea,select,button{font:inherit;color:inherit;background:var(--surface,#181824);border:1px solid var(--border,#39394b);border-radius:8px;padding:9px;width:100%}button{cursor:pointer}button:hover{border-color:var(--accent,#8b5cf6)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent,#8b5cf6)}.primary{background:var(--accent,#7545ce);color:white}#notice{min-height:20px}#rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:12px;overflow-wrap:anywhere}.row strong{max-width:65%}textarea{min-height:100px;resize:vertical}[hidden]{display:none!important}</style></head><body><main><h2>Twitch Predictions</h2><p>Manage your channel’s predictions and show their totals in OBS. Changes require confirmation above this widget.</p><p id="notice" role="status">Connecting to CDP…</p><section><strong id="question">No prediction loaded</strong><small id="state"></small><div id="rows"></div><button id="refresh">Refresh</button><button id="lock" hidden>Lock entries</button><label id="winnerLabel" hidden>Winning outcome<select id="winner"></select></label><button id="resolve" hidden>Resolve prediction</button><button id="cancel" hidden>Cancel and refund points</button></section><form id="create"><label>Question<input id="title" maxlength="45" required placeholder="Will we win this match?"></label><label>Outcomes, one per line<textarea id="outcomes" required>Yes
No</textarea></label><label>Entry window in seconds<input id="duration" type="number" min="30" max="1800" value="120" required></label><button id="start" class="primary">Start prediction</button></form></main><script>(()=>{"use strict";const $=id=>document.getElementById(id);function theme(t){for(const [k,v]of Object.entries(t||{}))if(typeof v==="string")document.documentElement.style.setProperty("--"+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase()),v)}function row(a,b){const el=document.createElement("div");el.className="row";const title=document.createElement("strong"),value=document.createElement("span");title.textContent=a;value.textContent=b;el.append(title,value);$("rows").append(el)}let serial=0,pending=null,current=null,ready=false,updated=0;function request(value){if(!ready||pending)return;const requestId="prediction-"+(++serial);pending={requestId,at:Date.now()};$("notice").textContent=value.action==="get"?"Refreshing…":"Confirm this change above the widget.";parent.postMessage({type:"cdp:predictions",requestId,value},"*");render()}function render(){const p=current;$("question").textContent=p?p.title:"No prediction loaded";$("state").textContent=p?p.status:"";$("rows").replaceChildren();if(p)for(const o of p.outcomes)row(o.title+(p.winner===o.id?" · Winner":""),o.users+" viewers · "+o.points+" points");const active=p&&["ACTIVE","LOCKED"].includes(p.status);$("lock").hidden=!p||p.status!=="ACTIVE";$("resolve").hidden=!active;$("cancel").hidden=!active;$("winnerLabel").hidden=!active;const chosen=$("winner").value;$("winner").replaceChildren();if(p)for(const o of p.outcomes){const el=document.createElement("option");el.value=o.id;el.textContent=o.title;$("winner").append(el)}if(p&&p.outcomes.some(o=>o.id===chosen))$("winner").value=chosen;for(const id of ["refresh","lock","resolve","cancel","start"])$(id).disabled=Boolean(pending)||(id==="start"&&Boolean(active));display()}function display(){const p=current,fresh=updated&&Date.now()-updated<30000;parent.postMessage({type:"cdp:browser-source",value:{version:1,kind:"counters",title:fresh&&p?(p.title+" · "+p.status):"Twitch Predictions · Waiting for updates",rows:fresh&&p?p.outcomes.map(o=>({label:o.title+(p.winner===o.id?" · Winner":""),value:o.users+" viewers · "+o.points+" points"})):[]}},"*")}$("refresh").onclick=()=>request({action:"get"});$("lock").onclick=()=>current&&request({action:"LOCKED",id:current.id});$("cancel").onclick=()=>current&&request({action:"CANCELED",id:current.id});$("resolve").onclick=()=>current&&request({action:"RESOLVED",id:current.id,winner:$("winner").value});$("create").onsubmit=e=>{e.preventDefault();request({action:"create",title:$("title").value,outcomes:$("outcomes").value.split("\n").map(v=>v.trim()).filter(Boolean),duration:Number($("duration").value)})};addEventListener("message",e=>{if(e.source!==parent)return;const m=e.data;if(m?.type==="cdp:init"){theme(m.theme);ready=true;request({action:"get"})}if(m?.type==="cdp:theme")theme(m.theme);if(m?.type==="cdp:predictions:result"&&m.requestId===pending?.requestId){pending=null;if(m.error){updated=0;$("notice").textContent=m.error}else if(Array.isArray(m.value)){current=m.value.find(p=>["ACTIVE","LOCKED"].includes(p.status))||m.value[0]||null;updated=Date.now();$("notice").textContent="Synced with Twitch. Totals refresh every 10 seconds."}render()}});setInterval(()=>{if(pending&&Date.now()-pending.at>60000){pending=null;updated=0;$("notice").textContent="Request timed out. Refresh before retrying a change.";render()}if(!pending)request({action:"get"})},10000);setInterval(display,1000);render();})();</script></body></html>
