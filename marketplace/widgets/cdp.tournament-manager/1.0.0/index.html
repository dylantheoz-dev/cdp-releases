<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tournament Manager</title><style>:root{--accent:#8b5cf6;--surface:#111827;--surface-hover:#263348;--text-primary:#f8fafc;--text-secondary:#94a3b8;--border:#334155;--danger-text:#fca5a5;font-family:Segoe UI,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text-primary);font-size:13px}main{display:grid;gap:10px}h2,h3,p{margin:0}h2{font-size:19px}h3{font-size:13px}header{border-bottom:1px solid var(--border);padding-bottom:9px}.panel{display:grid;gap:9px;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface);min-width:0}.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.row>*{min-width:0}.grow{flex:1}.muted,small{color:var(--text-secondary);font-size:11px}button,input,select,textarea{font:inherit;color:var(--text-primary);background:var(--surface-hover);border:1px solid var(--border);border-radius:7px;padding:8px;min-width:0}button{cursor:pointer}button:disabled,fieldset:disabled{opacity:.6;cursor:default}button:hover:not(:disabled){border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:#fff;font-weight:700}.danger{color:var(--danger-text)}label{display:grid;gap:4px;color:var(--text-secondary);font-size:11px}label input,label textarea,label select{width:100%}textarea{resize:vertical;min-height:60px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}.item{display:grid;gap:6px;border-top:1px solid var(--border);padding-top:8px;overflow-wrap:anywhere}.prompt{font-size:22px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}.list{display:grid;gap:8px;max-height:320px;overflow:auto}.status{color:var(--danger-text);font-size:12px} [hidden]{display:none!important}@media(max-width:380px){.grid{grid-template-columns:1fr}.prompt{font-size:18px}}
form{display:grid;gap:8px}form.row{display:flex}
label.row{display:flex}label.row input{width:auto}.list{max-height:450px}</style></head><body><main><header><h2>Tournament Manager</h2><p class="muted">Run community competitions with local scoring.</p></header><p id="status" role="status" class="status" hidden></p><fieldset id="controls" disabled><section class="panel"><div class="grid"><label>Tournament name<input id="name" maxlength="100" value="Community tournament"></label><label>Format<select id="format"><option value="single">Single elimination</option><option value="round">Round robin</option></select></label></div><label>Participants or teams (one per line)<textarea id="players" maxlength="2500" placeholder="Team A&#10;Team B"></textarea></label><div class="row"><button id="start" class="primary" type="button">Create tournament</button><button id="reset" type="button" class="danger">Clear tournament</button></div><small>2-16 distinct participants. Listed order determines seeding. A new tournament replaces the current one.</small></section><section class="panel"><div class="row"><h3 class="grow" id="title">No tournament yet</h3><span id="summary" class="muted"></span></div><p id="winner"></p><div id="matches" class="list"></div></section><section class="panel"><h3>Standings / results</h3><div id="standings" class="list"></div><label class="row"><input type="checkbox" id="broadcast"> Show standings in Browser Source</label><small>Only participant names and scores are included in the display.</small></section></fieldset></main><script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),post=(type,extra={})=>parent.postMessage({type,...extra},"*");
const txt=(x,n)=>typeof x==="string"?x.slice(0,n):"",arr=x=>Array.isArray(x)?x:[],uid=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
function el(tag,value,cls){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n}
function btn(value,action,cls){const n=el("button",value,cls);n.type="button";n.onclick=action;return n}
function theme(t){for(const [k,v] of Object.entries(t||{}))if(typeof v==="string"&&v.trim()){if(k==="colorScheme"&&["light","dark"].includes(v))document.documentElement.style.colorScheme=v;document.documentElement.style.setProperty("--"+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase()),v)}}
let hydrated=false,snapshot="";
function notice(s){$("status").textContent=s;$("status").hidden=!s}
function save(){if(!hydrated)return false;const serialized=JSON.stringify(state);if(new TextEncoder().encode(serialized).length>245760){state=JSON.parse(snapshot);notice("Storage limit reached. Remove older entries or shorten notes.");render();return false}post("cdp:storage:set",{value:state});snapshot=serialized;notice("");return true}
function changed(){const ok=save();render();return ok}
addEventListener("message",e=>{if(e.source!==parent||!e.data||typeof e.data!=="object")return;const m=e.data;if(m.type==="cdp:theme")theme(m.theme);if(m.type==="cdp:init"){theme(m.theme);if(!hydrated)post("cdp:storage:get",{requestId:"wave1-load"})}if(m.type==="cdp:storage:value"&&m.requestId==="wave1-load"&&!hydrated){state=normalize(m.value);snapshot=JSON.stringify(state);hydrated=true;$("controls").disabled=false;render()}});


const MAX=16,formats=["single","round"];let state=normalize(null),pending="";
function normalize(v){const name=txt(v?.name,100)||"Community tournament",format=formats.includes(v?.format)?v.format:"single";const players=[...new Set(arr(v?.players).map(x=>txt(x,100).trim()).filter(Boolean))].slice(0,MAX);const scores={};if(v?.scores&&typeof v.scores==="object")for(const [k,s] of Object.entries(v.scores).slice(0,120)){if(/^(r\d+-m\d+|p\d+-p\d+)$/.test(k)&&Array.isArray(s)&&s.length===2&&s.every(n=>Number.isInteger(n)&&n>=0&&n<=9999))scores[k]=s}return{name,format,players,scores,broadcast:v?.broadcast===true}}
function matches(){const p=state.players,rows=[];if(p.length<2)return rows;if(state.format==="round"){for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++)rows.push({id:"p"+i+"-p"+j,a:p[i],b:p[j],round:0});return rows}
let size=2;while(size<p.length)size*=2;let seeded=[1,2];while(seeded.length<size){const n=seeded.length*2+1;seeded=seeded.flatMap(x=>[x,n-x])}let round=seeded.map(i=>p[i-1]||null);for(let r=1;round.length>1;r++){const next=[];for(let i=0;i<round.length;i+=2){const a=round[i],b=round[i+1],id="r"+r+"-m"+(i/2+1),s=state.scores[id];let win=null;if(a===null&&b!==undefined)win=b;else if(b===null&&a!==undefined)win=a;else if(a&&b&&s&&s[0]!==s[1])win=s[0]>s[1]?a:b;else win=undefined;rows.push({id,a,b,round:r,winner:win});next.push(win)}round=next}return rows}
function standings(){const scores=state.players.map(name=>({name,w:0,d:0,l:0,for:0,against:0}));for(const m of matches()){const s=state.scores[m.id];if(!m.a||!m.b||!s)continue;const a=scores.find(x=>x.name===m.a),b=scores.find(x=>x.name===m.b);a.for+=s[0];a.against+=s[1];b.for+=s[1];b.against+=s[0];if(s[0]===s[1]){a.d++;b.d++}else if(s[0]>s[1]){a.w++;b.l++}else{a.l++;b.w++}}return scores.sort((a,b)=>(b.w*3+b.d)-(a.w*3+a.d)||((b.for-b.against)-(a.for-a.against))||b.for-a.for||a.name.localeCompare(b.name))}
function publish(){if(!hydrated)return;const rows=state.broadcast?standings().map(x=>({label:x.name,value:x.w+"W "+x.d+"D "+x.l+"L"})):[];post("cdp:browser-source",{value:{version:1,kind:"counters",title:state.broadcast?state.name:"Tournament scoreboard hidden",rows}})}
function render(){if(!hydrated)return;const ms=matches(),completed=ms.filter(m=>m.a&&m.b&&state.scores[m.id]).length,playable=ms.filter(m=>m.a!==null&&m.b!==null).length;$("title").textContent=state.players.length?state.name:"No tournament yet";$("summary").textContent=state.players.length?completed+"/"+playable+" scored":"";$("start").textContent=pending==="start"?"Confirm replace tournament":"Create tournament";$("reset").textContent=pending==="reset"?"Confirm clear":"Clear tournament";$("broadcast").checked=state.broadcast;$("matches").replaceChildren();$("standings").replaceChildren();const final=ms[ms.length-1];$("winner").textContent=state.format==="single"&&final?.winner?"Champion: "+final.winner:"";let lastRound=-1;for(const m of ms){if(m.round!==lastRound&&state.format==="single"){$("matches").append(el("h3","Round "+m.round));lastRound=m.round}const row=el("div",undefined,"item");row.append(el("strong",(m.a===null?"BYE":m.a||"TBD")+" vs "+(m.b===null?"BYE":m.b||"TBD")));if(m.a&&m.b){const line=el("div",undefined,"row"),a=document.createElement("input"),b=document.createElement("input");for(const [input,label] of [[a,m.a],[b,m.b]]){input.type="number";input.min="0";input.max="9999";input.step="1";input.setAttribute("aria-label",label+" score");input.style.width="75px"}const s=state.scores[m.id];a.value=s?.[0]??"";b.value=s?.[1]??"";const saveScore=()=>{const x=Number(a.value),y=Number(b.value);if(a.value===""||b.value===""||!Number.isInteger(x)||!Number.isInteger(y)||x<0||y<0||x>9999||y>9999||state.format==="single"&&x===y){notice("Enter valid scores; elimination matches cannot tie.");return}if(state.format==="single"&&s&&s[0]===x&&s[1]===y)return;if(state.format==="single"&&s){const descendants=Object.keys(state.scores).filter(k=>Number(k.match(/^r(\d+)/)?.[1])>m.round);if(descendants.length&&pending!==m.id){pending=m.id;notice("Saving this change clears all later-round scores. Click Save score again to confirm.");return}for(const k of descendants)delete state.scores[k]}state.scores[m.id]=[x,y];pending="";changed()};line.append(a,b,btn("Save score",saveScore));row.append(line)}else row.append(el("small",m.winner?"Advances: "+m.winner:"Waiting for earlier matches"));$("matches").append(row)}for(const [i,x] of standings().entries())$("standings").append(el("div",(i+1)+". "+x.name+" | "+x.w+"W "+x.d+"D "+x.l+"L"+(state.format==="round"?" | "+(x.w*3+x.d)+" pts":""),"item"));publish()}
function loadFields(){$("name").value=state.name;$("format").value=state.format;$("players").value=state.players.join("\n")}
$("start").onclick=()=>{const players=$("players").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(players.length<2||players.length>MAX||new Set(players.map(x=>x.toLowerCase())).size!==players.length||players.some(x=>x.length>100)){notice("Enter 2-16 unique names, each at most 100 characters.");return}if(state.players.length&&pending!=="start"){pending="start";render();return}state={name:$("name").value.trim()||"Community tournament",format:$("format").value,players,scores:{},broadcast:state.broadcast};pending="";changed();loadFields()};$("reset").onclick=()=>{if(pending!=="reset"){pending="reset";render();return}state=normalize(null);pending="";changed();loadFields()};$("broadcast").onchange=()=>{state.broadcast=$("broadcast").checked;changed()};addEventListener("message",e=>{if(e.source===parent&&e.data?.type==="cdp:storage:value"&&e.data.requestId==="wave1-load"&&hydrated)loadFields()});setInterval(publish,1000);
})();
</script></body></html>
