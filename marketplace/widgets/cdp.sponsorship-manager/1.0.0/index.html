<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sponsorship Manager</title><style>:root{--accent:#8b5cf6;--surface:#111827;--surface-hover:#263348;--text-primary:#f8fafc;--text-secondary:#94a3b8;--border:#334155;--danger-text:#fca5a5;font-family:Segoe UI,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--text-primary);font-size:13px}main{display:grid;gap:10px}h2,h3,p{margin:0}h2{font-size:19px}h3{font-size:13px}header{border-bottom:1px solid var(--border);padding-bottom:9px}.panel{display:grid;gap:9px;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface);min-width:0}.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.row>*{min-width:0}.grow{flex:1}.muted,small{color:var(--text-secondary);font-size:11px}button,input,select,textarea{font:inherit;color:var(--text-primary);background:var(--surface-hover);border:1px solid var(--border);border-radius:7px;padding:8px;min-width:0}button{cursor:pointer}button:disabled,fieldset:disabled{opacity:.6;cursor:default}button:hover:not(:disabled){border-color:var(--accent)}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.primary{background:var(--accent);color:#fff;font-weight:700}.danger{color:var(--danger-text)}label{display:grid;gap:4px;color:var(--text-secondary);font-size:11px}label input,label textarea,label select{width:100%}textarea{resize:vertical;min-height:60px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}fieldset{border:0;margin:0;padding:0;display:grid;gap:10px;min-width:0}.item{display:grid;gap:6px;border-top:1px solid var(--border);padding-top:8px;overflow-wrap:anywhere}.prompt{font-size:22px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}.list{display:grid;gap:8px;max-height:320px;overflow:auto}.status{color:var(--danger-text);font-size:12px} [hidden]{display:none!important}@media(max-width:380px){.grid{grid-template-columns:1fr}.prompt{font-size:18px}}
form{display:grid;gap:8px}form.row{display:flex}</style></head><body><main><header><h2>Sponsorship Manager</h2><p class="muted">Track campaign commitments and payment status locally.</p></header><p id="status" role="status" class="status" hidden></p><fieldset id="controls" disabled><section class="panel"><div class="row"><h3 class="grow">Campaigns</h3><button id="new" type="button">New campaign</button></div><label>Current campaign<select id="pick"></select></label><p id="summary" class="muted"></p><div class="row"><button id="remove" type="button" class="danger">Delete campaign</button></div></section><section class="panel"><h3 id="heading">Campaign details</h3><form id="form"><div class="grid"><label>Sponsor<input id="sponsor" required maxlength="100"></label><label>Campaign<input id="name" required maxlength="100"></label><label>Deadline<input id="date" type="date"></label><label>Payment status<select id="payment"><option>Not invoiced</option><option>Invoiced</option><option>Partially paid</option><option>Paid</option><option>Not applicable</option></select></label><label>Agreed amount (include currency)<input id="amount" maxlength="60" placeholder="USD 250"></label><label>Promo code<input id="code" maxlength="80"></label></div><label>Campaign link<input id="link" maxlength="300" placeholder="https://"></label><label>Talking points / requirements<textarea id="notes" maxlength="2000"></textarea></label><button type="submit" class="primary">Save campaign</button></form></section><section class="panel" id="deliverables"><h3>Deliverables</h3><form id="add" class="grid"><label>Task<input id="task" required maxlength="150"></label><label>Due date<input id="due" type="date"></label><button type="submit">Add deliverable</button></form><div id="tasks" class="list"></div></section><small>Local widget storage only. Do not store credentials, banking details or confidential contracts.</small></fieldset></main><script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),post=(type,extra={})=>parent.postMessage({type,...extra},"*");
const txt=(x,n)=>typeof x==="string"?x.slice(0,n):"",arr=x=>Array.isArray(x)?x:[],uid=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
function el(tag,value,cls){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;if(cls)n.className=cls;return n}
function btn(value,action,cls){const n=el("button",value,cls);n.type="button";n.onclick=action;return n}
function theme(t){for(const [k,v] of Object.entries(t||{}))if(typeof v==="string"&&v.trim()){if(k==="colorScheme"&&["light","dark"].includes(v))document.documentElement.style.colorScheme=v;document.documentElement.style.setProperty("--"+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase()),v)}}
let hydrated=false,snapshot="";
function notice(s){$("status").textContent=s;$("status").hidden=!s}
function save(){if(!hydrated)return false;const serialized=JSON.stringify(state);if(new TextEncoder().encode(serialized).length>245760){state=JSON.parse(snapshot);notice("Storage limit reached. Remove older entries or shorten notes.");render();return false}post("cdp:storage:set",{value:state});snapshot=serialized;notice("");return true}
function changed(){const ok=save();render();return ok}
addEventListener("message",e=>{if(e.source!==parent||!e.data||typeof e.data!=="object")return;const m=e.data;if(m.type==="cdp:theme")theme(m.theme);if(m.type==="cdp:init"){theme(m.theme);if(!hydrated)post("cdp:storage:get",{requestId:"wave1-load"})}if(m.type==="cdp:storage:value"&&m.requestId==="wave1-load"&&!hydrated){state=normalize(m.value);snapshot=JSON.stringify(state);hydrated=true;$("controls").disabled=false;render()}});

const payments=["Not invoiced","Invoiced","Partially paid","Paid","Not applicable"],date=x=>typeof x==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(x)?x:"";
let state=normalize(null),deleting=false,taskDelete="",draft=false;
function normalize(v){const campaigns=arr(v?.campaigns).slice(0,40).map(x=>({id:txt(x?.id,90)||uid(),sponsor:txt(x?.sponsor,100),name:txt(x?.name,100),date:date(x?.date),payment:payments.includes(x?.payment)?x.payment:payments[0],amount:txt(x?.amount,60),code:txt(x?.code,80),link:txt(x?.link,300),notes:txt(x?.notes,2000),tasks:arr(x?.tasks).slice(0,80).map(t=>({id:txt(t?.id,90)||uid(),name:txt(t?.name,150),date:date(t?.date),done:t?.done===true})).filter(t=>t.name)})).filter(x=>x.sponsor&&x.name);return{campaigns,selected:campaigns.some(x=>x.id===v?.selected)?v.selected:campaigns[0]?.id||null}}
const current=()=>state.campaigns.find(c=>c.id===state.selected),fields=["sponsor","name","date","payment","amount","code","link","notes"];
function fill(){const c=draft?null:current();for(const key of fields)$(key).value=c?.[key]||(key==="payment"?payments[0]:"");$("heading").textContent=c?"Edit campaign":"New campaign"}
function render(){if(!hydrated)return;const c=draft?null:current();$("pick").replaceChildren(el("option",draft||!state.campaigns.length?"New campaign":"Select campaign"));$("pick").options[0].value="";for(const x of state.campaigns){const o=el("option",x.sponsor+" / "+x.name);o.value=x.id;$("pick").append(o)}$("pick").value=c?.id||"";$("summary").textContent=state.campaigns.length+" campaigns"+(c?" | "+c.tasks.filter(t=>t.done).length+"/"+c.tasks.length+" deliverables completed":"");$("remove").disabled=!c;$("remove").textContent=deleting?"Confirm delete campaign":"Delete campaign";$("deliverables").hidden=!c;$("tasks").replaceChildren();if(c)for(const t of c.tasks){const r=el("div",undefined,"item"),line=el("div",undefined,"row");const label=el("label",undefined,"grow");const check=document.createElement("input");check.type="checkbox";check.checked=t.done;check.onchange=()=>{t.done=check.checked;changed()};label.append(el("span",t.name+(t.date?" | Due "+t.date:"")),check);line.append(label,btn(taskDelete===t.id?"Confirm":"Remove",()=>{if(taskDelete!==t.id){taskDelete=t.id;render();return}c.tasks=c.tasks.filter(x=>x.id!==t.id);taskDelete="";changed()},"danger"));r.append(line);$("tasks").append(r)}if(c&&!c.tasks.length)$("tasks").append(el("small","No deliverables yet."));if(!document.activeElement||!fields.includes(document.activeElement.id)){}}
$("new").onclick=()=>{draft=true;deleting=false;fill();render()};$("pick").onchange=()=>{const id=$("pick").value;draft=!id;if(id)state.selected=id;deleting=false;taskDelete="";if(id)save();fill();render()};$("form").onsubmit=e=>{e.preventDefault();if(!hydrated)return;const value=Object.fromEntries(fields.map(k=>[k,$(k).value.trim()]));if(!value.sponsor||!value.name)return;const c=draft?null:current();if(c)Object.assign(c,value);else{if(state.campaigns.length>=40){notice("Maximum 40 campaigns.");return}const entry={id:uid(),...value,tasks:[]};state.campaigns.push(entry);state.selected=entry.id;draft=false}if(changed())fill()};$("remove").onclick=()=>{const c=current();if(!c||draft)return;if(!deleting){deleting=true;render();return}state.campaigns=state.campaigns.filter(x=>x.id!==c.id);state.selected=state.campaigns[0]?.id||null;deleting=false;draft=false;changed();fill()};$("add").onsubmit=e=>{e.preventDefault();const c=current(),name=$("task").value.trim();if(!c||draft||!name)return;if(c.tasks.length>=80){notice("Maximum 80 deliverables per campaign.");return}c.tasks.push({id:uid(),name:txt(name,150),date:date($("due").value),done:false});if(changed())$("add").reset()};addEventListener("message",e=>{if(e.source===parent&&e.data?.type==="cdp:storage:value"&&e.data.requestId==="wave1-load"&&hydrated)fill()});
})();
</script></body></html>
